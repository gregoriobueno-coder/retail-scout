name: Retail Scout Price Sync

on:
  schedule:
    - cron: '0 12 * * *' # Every day at 12:00 UTC (7:00 AM EST)
  push:
    branches: [ main ]
  workflow_dispatch: # Allow manual trigger from GitHub web UI

permissions:
  contents: write # Allows the runner to commit and push database/HTML updates back to main

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Install Playwright & System Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Scraper Sync
        env:
          SIGNATURE_USERNAME: ${{ secrets.SIGNATURE_USERNAME }}
          SIGNATURE_PASSWORD: ${{ secrets.SIGNATURE_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ENABLE_TELEGRAM: true
          ENABLE_DESKTOP: false
          ENABLE_EMAIL: false
          ENABLE_PUSHOVER: false
        run: node index.js

      - name: Commit and Push Compiled Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html retail_scout.db auth/signature-state.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated Sync: Update retail pricing database & dashboard" && git push origin main)

      - name: Prepare Public Directory for Firebase
        run: |
          mkdir -p public
          cp index.html public/
          cp logo.png public/ || true

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_ADMIN_SECRET: "${{ secrets.FIREBASE || secrets.firebase || secrets['fireball'] || secrets['firebase-admin'] }}"
        run: |
          node -e '
            const fs = require("fs");
            const secret = process.env.FIREBASE_ADMIN_SECRET || "";
            let jsonContent = null;
            try {
              JSON.parse(secret);
              jsonContent = secret;
            } catch (e) {
              const start = secret.indexOf("{");
              const end = secret.lastIndexOf("}");
              if (start !== -1 && end !== -1 && end > start) {
                const candidate = secret.substring(start, end + 1);
                try {
                  const obj = eval("(" + candidate + ")");
                  if (obj && typeof obj === "object" && obj.project_id) {
                    jsonContent = JSON.stringify(obj);
                    console.log("Successfully extracted JSON from JS code snippet!");
                  }
                } catch (evalErr) {
                  console.log("Failed to parse extracted JS object:", evalErr.message);
                }
              }
            }
            if (jsonContent) {
              console.log("Writing service-account.json...");
              fs.writeFileSync("service-account.json", jsonContent);
            }
          '
          if [ -f service-account.json ]; then
            echo "Authenticating via Service Account JSON..."
            export GOOGLE_APPLICATION_CREDENTIALS=service-account.json
            echo "Creating hosting site fambotpage-public if not exists..."
            npx firebase-tools hosting:sites:create fambotpage-public --project fambotpage || true
            npx firebase-tools deploy --only hosting --project fambotpage
          else
            echo "Authenticating via Firebase Auth Token..."
            echo "Creating hosting site fambotpage-public if not exists..."
            npx firebase-tools hosting:sites:create fambotpage-public --project fambotpage --token "$FIREBASE_ADMIN_SECRET" || true
            npx firebase-tools deploy --only hosting --project fambotpage --token "$FIREBASE_ADMIN_SECRET"
          fi
